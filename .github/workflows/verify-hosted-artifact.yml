name: verify hosted artifact provenance

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      artifact_run_id:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify source and artifact provenance before Azure authentication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ inputs.artifact_run_id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          branch="$(gh api "repos/$REPOSITORY" --jq '.default_branch')"
          run="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")"
          echo "$run" | jq -e --arg sha "$SOURCE_SHA" --arg branch "$branch" --arg repo "$REPOSITORY" \
            '.conclusion == "success" and .head_sha == $sha and .head_branch == $branch and .head_repository.full_name == $repo and .path == ".github/workflows/publish-hosted.yml"'
