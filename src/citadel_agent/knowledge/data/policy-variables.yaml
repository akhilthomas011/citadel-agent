# Product policy variables that Citadel's policy fragments read, and the access-contract intent
# fields the agent uses to set them. Users change the intent; the agent renders the policy XML.
version: 1
variables:
  - {name: allowedModels, intentField: "services[].policy.allowedModels", type: csv, default: "(all models)", description: "Models the product may call. Comma-separated with no spaces; empty allows every model.", evidence: [{file: bicep/infra/modules/apim/policies/frag-get-available-models.xml, contains: '"allowedModels"'}]}
  - {name: allowedBackendPools, intentField: "services[].policy.allowedBackendPools", type: csv, default: "(all pools)", description: Backend pools the product may use., evidence: [{file: bicep/infra/modules/apim/policies/azure-open-ai-api-policy.xml, contains: '"allowedBackendPools"'}]}
  - {name: llm-token-limit, intentField: "services[].policy.tokenLimit", type: policy, default: "(none)", description: "Tokens per minute (429 when exceeded) and an optional Monthly or Weekly token quota (403 when exhausted). Per-model limits use services[].policy.modelTokenLimits."}
  - {name: jwtRequired, intentField: "services[].policy.jwt.required", type: bool, default: "false", description: Require an Entra ID bearer token in addition to the subscription key., evidence: [{file: bicep/infra/modules/apim/policies/frag-security-handler.xml, contains: '"jwtRequired"'}]}
  - {name: requiredRoles, intentField: "services[].policy.jwt.requiredRoles", type: csv, default: "(none)", description: App roles of which the token must contain at least one., evidence: [{file: bicep/infra/modules/apim/policies/frag-security-handler.xml, contains: '"requiredRoles"'}]}
  - {name: jwtAudience, intentField: "services[].policy.jwt.audience", type: string, default: "(gateway app registration)", description: Overrides the expected token audience., evidence: [{file: bicep/infra/modules/apim/policies/frag-security-handler.xml, contains: '"jwtAudience"'}]}
  - {name: jwtIssuer, intentField: "services[].policy.jwt.issuer", type: string, default: "(gateway tenant)", description: Overrides the expected token issuer., evidence: [{file: bicep/infra/modules/apim/policies/frag-security-handler.xml, contains: '"jwtIssuer"'}]}
  - {name: jwtOpenIdConfigUrl, intentField: "services[].policy.jwt.openidConfigUrl", type: url, default: "(gateway tenant)", description: Overrides the OpenID configuration used to validate tokens., evidence: [{file: bicep/infra/modules/apim/policies/frag-security-handler.xml, contains: '"jwtOpenIdConfigUrl"'}]}
  - {name: piiAnonymizationEnabled, intentField: "services[].policy.pii.mode", type: bool, default: "false", description: "Replace PII with placeholders before the model sees it (mode: anonymize). mode: block rejects requests with 400 PII_DETECTED instead.", evidence: [{file: bicep/infra/modules/apim/policies/frag-pii-anonymization.xml, contains: '"piiAnonymizationEnabled"'}]}
  - {name: piiConfidenceThreshold, intentField: "services[].policy.pii.confidenceThreshold", type: number, default: "0.8", description: Minimum detection confidence., evidence: [{file: bicep/infra/modules/apim/policies/frag-pii-anonymization.xml, contains: '"piiConfidenceThreshold"'}]}
  - {name: piiEntityCategoryExclusions, intentField: "services[].policy.pii.excludedCategories", type: csv, default: "(none)", description: PII categories to leave untouched., evidence: [{file: bicep/infra/modules/apim/policies/frag-pii-anonymization.xml, contains: '"piiEntityCategoryExclusions"'}]}
  - {name: piiDetectionLanguage, intentField: "services[].policy.pii.language", type: string, default: en, description: Language code or auto., evidence: [{file: bicep/infra/modules/apim/policies/frag-pii-anonymization.xml, contains: '"piiDetectionLanguage"'}]}
  - {name: piiRegexPatterns, intentField: "services[].policy.pii.regexPatterns", type: json, default: "[]", description: Extra regular expressions with a category name., evidence: [{file: bicep/infra/modules/apim/policies/frag-pii-anonymization.xml, contains: '"piiRegexPatterns"'}]}
  - {name: piiMaxChunkSize, intentField: "services[].policy.pii.maxChunkSize", type: int, default: "5000", description: Characters per Language API document (500 to 5120)., evidence: [{file: bicep/infra/modules/apim/policies/frag-pii-anonymization.xml, contains: '"piiMaxChunkSize"'}]}
  - {name: piiChunkOverlap, intentField: "services[].policy.pii.chunkOverlap", type: int, default: "250", description: Overlap between chunks., evidence: [{file: bicep/infra/modules/apim/policies/frag-pii-anonymization.xml, contains: '"piiChunkOverlap"'}]}
  - {name: piiStateSavingEnabled, intentField: "services[].policy.pii.saveState", type: bool, default: "false", description: Store PII processing records for audit., evidence: [{file: bicep/infra/modules/apim/policies/frag-pii-state-saving.xml, contains: '"piiStateSavingEnabled"'}]}
  - {name: alertsEnabled, intentField: "services[].policy.alerts.enabled", type: bool, default: "true", description: Master switch for alert events of the product., evidence: [{file: bicep/infra/modules/apim/policies/frag-raise-alert-events.xml, contains: '"alertsEnabled"'}]}
  - {name: alertOnThrottling, intentField: "services[].policy.alerts.throttling", type: bool, default: "true", description: Emit alert events for 429 throttling., evidence: [{file: bicep/infra/modules/apim/policies/frag-raise-alert-events.xml, contains: '"alertOnThrottling"'}]}
  - {name: alertOnQuotaExceeded, intentField: "services[].policy.alerts.quotaExceeded", type: bool, default: "true", description: Emit alert events for exhausted token quotas., evidence: [{file: bicep/infra/modules/apim/policies/frag-raise-alert-events.xml, contains: '"alertOnQuotaExceeded"'}]}
  - {name: alertOnBackendFailure, intentField: "services[].policy.alerts.backendFailure", type: bool, default: "true", description: Emit alert events for backend 5xx failures., evidence: [{file: bicep/infra/modules/apim/policies/frag-raise-alert-events.xml, contains: '"alertOnBackendFailure"'}]}
  - {name: alertOnAuthFailure, intentField: "services[].policy.alerts.authFailure", type: bool, default: "false", description: Emit alert events for 401 and 403 authorization failures., evidence: [{file: bicep/infra/modules/apim/policies/frag-raise-alert-events.xml, contains: '"alertOnAuthFailure"'}]}
  - {name: alertOnContentSafety, intentField: "services[].policy.alerts.contentSafety", type: bool, default: "false", description: Emit alert events for content safety blocks., evidence: [{file: bicep/infra/modules/apim/policies/frag-raise-alert-events.xml, contains: '"alertOnContentSafety"'}]}
  - {name: alertOnPiiFailure, intentField: "services[].policy.alerts.piiFailure", type: bool, default: "false", description: Emit alert events for PII service failures., evidence: [{file: bicep/infra/modules/apim/policies/frag-raise-alert-events.xml, contains: '"alertOnPiiFailure"'}]}
  - {name: customDimension1, intentField: "services[].policy.customDimension1", type: string, default: NA, description: "Usage dimension from a request header or a static value (for example an end-user or session ID).", evidence: [{file: bicep/infra/modules/apim/policies/frag-a2a-usage.xml, contains: '"customDimension1"'}]}
  - {name: customDimension2, intentField: "services[].policy.customDimension2", type: string, default: NA, description: Second usage dimension., evidence: [{file: bicep/infra/modules/apim/policies/frag-a2a-usage.xml, contains: '"customDimension2"'}]}
  - {name: enableResponseHeaders, intentField: "services[].policy.responseHeaders", type: bool, default: "false", description: "Add UAIG-* diagnostic response headers (development only).", evidence: [{file: bicep/infra/modules/apim/policies/frag-set-response-headers.xml, contains: '"enableResponseHeaders"'}]}
  - {name: contractToolApis, intentField: "services[].toolApis", type: csv, default: "(none)", description: APIs of a multi-asset product treated as MCP tools., evidence: [{file: bicep/infra/modules/apim/policies/frag-set-asset-kind.xml, contains: '"contractToolApis"'}]}
  - {name: contractAgentApis, intentField: "services[].agentApis", type: csv, default: "(none)", description: APIs of a multi-asset product treated as A2A agents., evidence: [{file: bicep/infra/modules/apim/policies/frag-set-asset-kind.xml, contains: '"contractAgentApis"'}]}
  - {name: appId, intentField: "(request header x-app-id)", type: string, default: "(subscription ID)", description: "Usage attribution per application; clients set it with the x-app-id header.", evidence: [{file: bicep/infra/modules/apim/policies/frag-a2a-usage.xml, contains: '"appId"'}]}
