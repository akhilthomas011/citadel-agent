# Unprivileged pull request validation. No cloud credentials are available to this workflow.
name: citadel-validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request with the pinned upstream submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restrict agent pull requests to contract paths
        if: startsWith(github.head_ref, 'citadel-agent/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          disallowed=$(echo "$changed" | grep -Ev '^(contracts/|\.citadel/(rotations|locks|changesets)/)' || true)
          if [ -n "$disallowed" ]; then
            echo "Agent pull requests may only change contracts and change records. Disallowed paths:"
            echo "$disallowed"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install the Citadel Agent at the version pinned for this repository
        shell: bash
        env:
          CITADEL_AGENT_PACKAGE: ${{ vars.CITADEL_AGENT_PACKAGE }}
        run: |
          set -euo pipefail
          if [[ ! "$CITADEL_AGENT_PACKAGE" =~ ^git\+https://github\.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)@([0-9a-f]{40})$ ]]; then
            echo "::error::CITADEL_AGENT_PACKAGE must be git+https://github.com/<owner>/<repo>@<40-character-commit>."
            exit 1
          fi
          repository="${BASH_REMATCH[1]}"
          commit="${BASH_REMATCH[2]}"
          agent="$RUNNER_TEMP/citadel-agent"
          git init "$agent"
          git -C "$agent" remote add origin "https://github.com/$repository"
          git -C "$agent" fetch --depth=1 origin "$commit"
          git -C "$agent" checkout --detach FETCH_HEAD
          test "$(git -C "$agent" rev-parse HEAD)" = "$commit"
          git -C "$agent" submodule update --init --recursive
          uv --no-config sync --project "$agent" --locked --no-dev --group build --no-install-project --no-build --python 3.11
          uv --no-config sync --project "$agent" --locked --no-dev --group build --no-editable --no-build-isolation --python 3.11
          echo "$agent/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate contracts (schema, generated files, policies, caps, secrets, Bicep compile)
        shell: bash
        run: citadel-agent contracts validate --repo . --base "origin/${{ github.base_ref }}" --compile
