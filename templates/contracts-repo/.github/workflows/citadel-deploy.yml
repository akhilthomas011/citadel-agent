# Deploy merged contract changes, in change-set order, per environment.
#
# Only the reviewed merge commit is deployed. Each environment (citadel-dev, citadel-test,
# citadel-prod) is a GitHub environment with its own OIDC identity and required reviewers.
name: citadel-deploy

on:
  push:
    branches: [main]
    paths:
      - ".citadel/changesets/**"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      manifests: ${{ steps.find.outputs.manifests }}
    steps:
      - name: Check out the merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Find change sets added by this merge (skip ones already deployed directly)
        id: find
        shell: bash
        run: |
          set -euo pipefail
          # Names are NUL separated so no character in a file name is ever interpreted by a shell.
          git diff -z --name-only --diff-filter=A HEAD~1 HEAD -- .citadel/changesets/ > "$RUNNER_TEMP/added.bin"
          python3 - "$RUNNER_TEMP/added.bin" >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          NAME = re.compile(r"^\.citadel/changesets/cs-[0-9]{8}-[0-9]{6}-[0-9a-f]{6}\.json$")
          ENVIRONMENT = re.compile(r"^[a-z][a-z0-9-]{0,30}$")
          entries = []
          for raw in open(sys.argv[1], "rb").read().split(b"\0"):
              if not raw:
                  continue
              path = raw.decode("utf-8", "replace")
              if path.endswith(".gitkeep"):
                  continue
              if not NAME.match(path):
                  print(f"::error::Unexpected file in .citadel/changesets/: {path!r}", file=sys.stderr)
                  sys.exit(1)
              manifest = json.load(open(path, encoding="utf-8"))
              environment = str(manifest.get("environment", ""))
              if not ENVIRONMENT.match(environment):
                  print(f"::error::Invalid environment name in {path}", file=sys.stderr)
                  sys.exit(1)
              if manifest.get("executedBy") != "direct":
                  entries.append({"manifest": path, "environment": environment})
          print("manifests=" + json.dumps(entries))
          PY

  deploy:
    needs: plan
    if: needs.plan.outputs.manifests != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.plan.outputs.manifests) }}
    environment: citadel-${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the merge commit with the pinned upstream submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install the Citadel Agent
        shell: bash
        env:
          CITADEL_AGENT_PACKAGE: ${{ vars.CITADEL_AGENT_PACKAGE }}
        run: |
          set -euo pipefail
          if [[ ! "$CITADEL_AGENT_PACKAGE" =~ ^git\+https://github\.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)@([0-9a-f]{40})$ ]]; then
            echo "::error::CITADEL_AGENT_PACKAGE must be git+https://github.com/<owner>/<repo>@<40-character-commit>."
            exit 1
          fi
          repository="${BASH_REMATCH[1]}"
          commit="${BASH_REMATCH[2]}"
          agent="$RUNNER_TEMP/citadel-agent"
          git init "$agent"
          git -C "$agent" remote add origin "https://github.com/$repository"
          git -C "$agent" fetch --depth=1 origin "$commit"
          git -C "$agent" checkout --detach FETCH_HEAD
          test "$(git -C "$agent" rev-parse HEAD)" = "$commit"
          git -C "$agent" submodule update --init --recursive
          uv --no-config sync --project "$agent" --locked --no-dev --group build --no-install-project --no-build --python 3.11
          uv --no-config sync --project "$agent" --locked --no-dev --group build --no-editable --no-build-isolation --python 3.11
          echo "$agent/.venv/bin" >> "$GITHUB_PATH"

      - name: Sign in to Azure with OpenID Connect (deployment identity for this environment)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the change set (what-if, then deploy each step in order)
        shell: bash
        env:
          CITADEL_AGENT_CREDENTIAL: cli
          # A path from the repository is passed as data, never spliced into the script text.
          MANIFEST: ${{ matrix.manifest }}
        run: citadel-agent contracts deploy --repo . --manifest "$MANIFEST"
